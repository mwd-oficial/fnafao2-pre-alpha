<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="style.css">
    <title>Fnafão 2 Pré-Alpha</title>
</head>

<body>
    <iframe src="iframe/index.html" allow="autoplay; fullscreen; xr-spatial-tracking"></iframe>

    <div id="cursor-none-div"></div>

    <div id="tela-cheia">
        <p class="ajustar-font-size">Para uma melhor experiência, <br> clique para ativar a tela cheia</p>
        <span class="material-symbols-rounded ajustar-font-size">fullscreen</span>
    </div>

    <div id="tela-qualidade">
        <p>Escolha a qualidade do jogo:</p>
        <div id="opcoes-qualidade">
            <button class="btn-qualidade" id="btn-baixa">Baixa</button>
            <button class="btn-qualidade" id="btn-alta">Alta</button>
        </div>
    </div>

    <div id="tela-vira-landscape">
        <span class="material-symbols-rounded">screen_rotation</span>
        <p>Para uma melhor experiência,<br>vire o seu celular.</p>
    </div>

    <script src="script.js"></script>
</body>

</html>
