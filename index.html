<!DOCTYPE html>
<html lang="pt-br">
<!--
Eu tenho esses códigos de um site meu em que carrego meus 2 projetos do playcanvas dentro de 1 iframe. como pode ver, o usuário tem a opção de escolher 2 qualidades (alta ou baixa). se o dispositivo em que o usuário estiver for fraco (como um celular), se ele clicar nos gráficos baixos roda normalmente. mas quando ele clica em alto, provavelmente a gpu não aguenta renderizar ou dá problema de webgl context ou algo assim, aí aparece uma tela branca com um rostinho triste quadrado e pequeno no canto dentro do iframe. quero criar uma tela no site para exibir para o usuário caso dê esse problema, instruindo ele a carregar com os gráficos baixos (pode ser um botão que já carrega direto na url quality=low). será que quando dá esse tipo de erro é necessário atualizar a página? porque aí o botão seria para atualizar a página para o usuário escolher de novo. sobre o css, a tela cheia e vira landscape devem ficar acima dessa nova tela. retorne o código completo do html, css e js com as alterações por favor.
-->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
    <link rel="stylesheet" href="style.css">
    <title>Fnafão 2 Pré-Alpha</title>
</head>

<body>
    <iframe src="iframe/index.html" allow="autoplay; fullscreen; xr-spatial-tracking"></iframe>

    <div id="cursor-none"></div>

    <div id="bloqueio-tela-inicial"></div>

    <div id="tela-cheia">
        <p class="ajustar-font-size">Para uma melhor experiência, <br> clique para ativar a tela cheia</p>
        <span class="material-symbols-rounded ajustar-font-size">fullscreen</span>
    </div>

    <div id="tela-qualidade">
        <p>Escolha a qualidade do jogo:</p>
        <div id="opcoes-qualidade">
            <button class="btn-qualidade" id="btn-baixa">Baixa</button>
            <button class="btn-qualidade" id="btn-alta">Alta</button>
        </div>
    </div>

    <div id="tela-vira-landscape">
        <span class="material-symbols-rounded">screen_rotation</span>
        <p>Para uma melhor experiência,<br>vire o seu celular.</p>
    </div>

    <script src="script.js"></script>
</body>

</html>
